<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="SIAKAD OBE Sekolah - monitoring capaian pembelajaran, penilaian, dan refleksi pembelajaran.">
  <title>SIAKAD OBE Sekolah</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SIAKAD OBE">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Terapkan tema sebelum halaman tampil supaya tidak berkedip putih -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('siakad-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#0b1120');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dark.css">
</head>
<body>
  <div id="app"><p class="loading">Memuat...</p></div>
  <script src="/js/app.js"></script>
  <script src="/js/pwa.js" defer></script>
</body>
</html>
